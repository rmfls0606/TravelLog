name: Functions CI

on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/functions-ci.yml"
  push:
    branches: [release, develop, main]
    paths:
      - "functions/**"
      - ".github/workflows/functions-ci.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
